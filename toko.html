<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toko · wb.prediction</title>
<style>
:root{--bg:#ebeefb;--ink:#171b45;--mute:#5a6090;--line:#cfd5ee;--acc:#3239d6;--accink:#fff;--card:#f6f8ff;--wa:#118a4b}
@media (prefers-color-scheme:dark){:root{--bg:#11142e;--ink:#e7e9ff;--mute:#9aa2d6;--line:#2a3060;--acc:#8c93ff;--accink:#11142e;--card:#1a1e42;--wa:#3ddc84}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0 auto;max-width:640px;padding:26px 20px 64px;color:var(--ink);font:17px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
a{color:var(--acc)}
.top a.home{text-decoration:none;color:var(--ink)}
h1.brand{font:800 clamp(22px,6.6vw,34px)/1.2 "Rockwell","Roboto Slab",Georgia,serif;margin:0;letter-spacing:-.01em}
.tag{color:var(--mute);margin:6px 0 0;font-size:15px;line-height:1.5}
.nav{margin:12px 0 22px;font-size:15px}
.nav a{margin-right:16px}
.nav b{margin-right:16px}
.produk{border-top:2px solid var(--ink);padding:20px 0 26px;border-bottom:1px solid var(--line)}
.produk h2{font:700 26px/1.3 Georgia,"Iowan Old Style",serif;margin:0 0 6px}
.produk p.desc{margin:0 0 14px;color:var(--mute)}
.produk ul{margin:0 0 18px;padding:0;list-style:none}
.produk li{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.dot{flex-shrink:0;width:12px;height:12px;border-radius:50%;margin-top:9px;background:var(--c)}
.harga{font:800 24px/1.2 ui-rounded,"SF Pro Rounded","Trebuchet MS",system-ui,sans-serif;margin:0 0 14px}
.aksi{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;border:0;border-radius:99px;padding:11px 20px;font:700 15px/1.2 system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.wa{background:var(--wa);color:#fff}
@media (prefers-color-scheme:dark){.btn.wa{color:#06220f}}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.warn{margin-top:22px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--mute);font-size:14.5px;line-height:1.6}
footer{margin-top:36px;color:var(--mute);font-size:14px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.btn.tg{background:#229ed9;color:#fff}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.btn.pri{background:var(--acc);color:var(--accink)}
.kontak{margin-top:22px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.kontak h3{margin:0 0 6px;font:700 19px/1.3 Georgia,serif}
.kontak p{margin:0 0 12px;color:var(--mute);font-size:15px;line-height:1.55}
.cek{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-size:16px;cursor:pointer}
.cek input{width:22px;height:22px;accent-color:var(--acc)}
#info{margin:12px 0 0;font-size:15px;color:var(--mute)}
#info.err{color:#d23b3b}
</style>
</head>
<body>
<div class="top">
  <a class="home" href="toko.html"><h1 class="brand" id="brand"></h1></a>
  <p class="tag" id="tag"></p>
</div>
<nav class="nav"><a href="./">Aplikasi</a><a href="blog.html">Blog</a><b>Toko</b></nav>
<main id="app"></main>
<div class="warn" id="warn"></div>
<footer id="foot"></footer>

<script>
/* Toko alifavif: link member dan status kunci memakai akun scenangka (diatur dari admin scenangka) */
window.WB_CONFIG = {
  WORKER: 'https://steep-resonance-6a71.kjago7822.workers.dev',
  ACCT: 'scenangka-scenangka',
  TOKO_LINKS: [
    { id: 'kjago7822',       url: 'https://kjago7822.github.io/WB-PREDICTION-/' },
    { id: 'wgus543-hub',     url: 'https://wgus543-hub.github.io/WB-PREDICTION-/' },
    { id: 'mamakeavif-star', url: 'https://mamakeavif-star.github.io/WB-PREDICTION-/' },
    { id: 'adinealif-byte',  url: 'https://adinealif-byte.github.io/WB-PREDICTION-/' }
  ]
};
</script>
<script>
/* ====== EDIT DI SINI ====== */
const TOKO = {
  nama: "💫WB.PREDICTION💫",
  deskripsi: "Semua bisa jadi master · Aplikasi Scen Angka otomatis",
  footer: "© 2026 wb.prediction",
  catatan: "Aplikasi ini hanya alat bantu rekap dan analisis. Hasil undian bersifat acak, jadi tidak ada jaminan hasil apa pun."
};

/* Kontak admin: WA awali 62 tanpa + dan tanpa 0. Telegram tanpa @ */
const ADMIN = { wa: "6288902862338", tg: "Scenangka" };

/* Daftar link Toko Member ada di wb-config.js (TOKO_LINKS). Buka/kunci dilakukan di panel Admin > Pengaturan. */
const LINKS = (window.WB_CONFIG && window.WB_CONFIG.TOKO_LINKS) || [];

const PRODUK = [
  {
    nama: "Wongbagus Prediction",
    desc: "Aplikasi scanner dan rekap angka yang jalan langsung di browser HP, tanpa install.",
    fitur: [
      "Scanner otomatis untuk banyak pasaran",
      "Input rumus manual dan cek trek",
      "Bank rumus untuk menyimpan dan mengelompokkan",
      "Rekap otomatis dan kirim lewat WhatsApp"
    ],
    demo: "./"
  }
];
/* ====== SELESAI ====== */

const WARNA = ["#e5484d","#f2a900","#1fa36b","#2f6bff","#8b5cf6"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

$("brand").textContent = TOKO.nama;
$("tag").textContent = TOKO.deskripsi;
$("warn").textContent = TOKO.catatan;
$("foot").textContent = TOKO.footer;

const P = PRODUK[0];
$("app").innerHTML = `<section class="produk">
  <h2>${esc(P.nama)}</h2>
  <p class="desc">${esc(P.desc)}</p>
  <ul>${P.fitur.map((f, i) => `<li><span class="dot" style="--c:${WARNA[i % 5]}"></span><span>${esc(f)}</span></li>`).join("")}</ul>
  <div class="aksi">
    <a class="btn pri" id="btnMember" href="#">Toko Member</a>
    ${P.demo ? `<a class="btn ghost" href="${esc(P.demo)}">Lihat aplikasi</a>` : ""}
  </div>
  <p id="info"></p>
</section>
<section class="kontak">
  <h3>Sudah daftar? Hubungi admin</h3>
  <p>Setelah selesai daftar di situs member, centang kotak di bawah lalu pilih WhatsApp atau Telegram untuk minta di-ACC.</p>
  <label class="cek"><input type="checkbox" id="sudah"> Saya sudah daftar</label>
  <div class="aksi">
    <a class="btn wa" id="btnWa" href="#" aria-disabled="true">WhatsApp</a>
    <a class="btn tg" id="btnTg" href="#" aria-disabled="true">Telegram</a>
  </div>
</section>`;

/* ---- status link: true/absen = buka, false = terkunci ---- */
let STATUS = {};
const dibuka = () => LINKS.filter(l => STATUS[l.id] !== false);
const simpan = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const baca = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };

async function muatStatus() {
  try {
    const c = window.WB_CONFIG || {};
    const acct = c.ACCT || "";
    if (!c.WORKER || !acct) return;
    const base = c.WORKER + "/" + acct;
    const lg = await (await fetch(base + "/logs", { cache: "no-store" })).json();
    const mb = lg && lg.membersBin;
    if (!mb) return;
    const d = await (await fetch(base + "/" + mb, { cache: "no-store" })).json();
    const arr = Array.isArray(d) ? d : ((d && d.data) || []);
    const st = arr.find(m => m.id === "__SETTINGS__");
    if (st && st.tk) STATUS = st.tk;
  } catch (e) { /* gagal baca: semua link dianggap buka */ }
}

function isiKontak() {
  const situs = baca("wb_toko_situs");
  const teks = `Halo admin, saya sudah daftar${situs ? " di situs " + situs : ""}. Mohon di-ACC.`;
  $("btnWa").href = `https://wa.me/${ADMIN.wa}?text=${encodeURIComponent(teks)}`;
  $("btnTg").href = `https://t.me/${ADMIN.tg}?text=${encodeURIComponent(teks)}`;
  for (const id of ["btnWa", "btnTg"]) { $(id).target = "_blank"; $(id).rel = "noopener"; }
}
function setAktif(on) {
  for (const id of ["btnWa", "btnTg"]) $(id).setAttribute("aria-disabled", on ? "false" : "true");
}
$("sudah").checked = baca("wb_toko_sudah") === "1";
setAktif($("sudah").checked);
isiKontak();
$("sudah").addEventListener("change", e => {
  simpan("wb_toko_sudah", e.target.checked ? "1" : "0");
  setAktif(e.target.checked);
});

$("btnMember").addEventListener("click", e => {
  e.preventDefault();
  const buka = dibuka();
  if (!buka.length) {
    $("info").className = "err";
    $("info").textContent = "Pendaftaran sedang penuh. Silakan hubungi admin lewat tombol di bawah.";
    return;
  }
  const pilih = buka[Math.floor(Math.random() * buka.length)];
  simpan("wb_toko_situs", pilih.id);
  isiKontak();
  $("info").className = "";
  $("info").textContent = "Daftar dulu di situs yang terbuka, lalu kembali ke sini dan hubungi admin.";
  window.open(pilih.url, "_blank", "noopener");
});

muatStatus();
</script>
</body>
</html>

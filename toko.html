<style>

html{background:#232323}
body{margin:0 auto;max-width:760px;padding:0 0 56px;color:var(--ink);font:15px/1.6 Arial,"Roboto Condensed",system-ui,sans-serif;background:#000;box-shadow:0 0 8px #000;min-height:100vh}

.dot{flex-shrink:0;width:12px;height:12px;border-radius:50%;margin-top:7px;background:var(--c)}
.harga{font:800 24px/1.2 Arial,sans-serif;margin:0 0 14px}

.warn{margin:10px 10px 0;padding:14px 16px;background:var(--card);border:2px solid var(--line);border-radius:14px;color:var(--mute);font-size:14px;line-height:1.6}
footer{margin-top:30px;text-align:center;color:#fff;font-size:12px;padding:5px 10px;border:2px solid #000;background:linear-gradient(80deg,#000 0,#000 0,#f50505 50%,#000 100%);text-shadow:0 0 2px #000}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.btn.tg{background:#229ed9;color:#fff}
.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.btn.pri{background:#19511e;color:#fff}
.kontak{margin-top:0;padding:16px 14px;background:var(--card);border:3px solid var(--line);border-radius:18px;box-shadow:0 0 10px rgba(236,168,8,.55)}

.kontak p{margin:0 0 12px;color:var(--mute);font-size:15px;line-height:1.55}
.cek{display:flex;gap:10px;align-items:center;margin:0 0 14px;font-size:16px;cursor:pointer}
.cek input{width:22px;height:22px;accent-color:var(--acc)}
#info{margin:12px 0 0;font-size:15px;color:var(--mute)}
#info.err{color:var(--bad)}

/* ===== salam badut ===== */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,12,40,.62);padding:18px;overflow:hidden}
.ov.on{display:flex;animation:ovin .25s ease-out}
@keyframes ovin{from{opacity:0}to{opacity:1}}
.ovc{position:relative;z-index:2;width:min(340px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 16px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.bub{position:relative;background:var(--bg);border:1.5px solid var(--acc);border-radius:16px;padding:12px 14px;font:700 17px/1.45 Arial,sans-serif;margin:0 0 14px}
.bub:after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:var(--bg);border-right:1.5px solid var(--acc);border-bottom:1.5px solid var(--acc);transform:translateX(-50%) rotate(45deg)}
#badut{width:190px;height:auto;display:block;margin:0 auto 10px;overflow:visible}
.bob{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.wave{animation:wave .6s ease-in-out infinite alternate;transform-origin:138px 155px}
@keyframes wave{from{transform:rotate(-16deg)}to{transform:rotate(20deg)}}
.blink{animation:blink 4s infinite;transform-origin:100px 90px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.fx{position:absolute;top:-30px;pointer-events:none;animation:fall linear forwards;will-change:transform}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.up{position:absolute;bottom:-40px;pointer-events:none;animation:up linear forwards;font-size:26px}
@keyframes up{to{transform:translateY(-112vh) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){.bob,.wave,.blink{animation:none}.fx,.up{display:none}}
.nav a,.nav b{white-space:nowrap}
@media (max-width:480px){.nav{font-size:12px}}
</style>
</head>

<script>
/* ====== EDIT DI SINI ====== */
const TOKO = {
  nama: "💫WB.PREDICTION💫",
  deskripsi: "Semua bisa jadi master · Aplikasi Scen Angka otomatis",
  footer: "© 2026 wb.prediction",
  catatan: "Aplikasi ini hanya alat bantu rekap dan analisis. Hasil undian bersifat acak, jadi tidak ada jaminan hasil apa pun."
};

/* Kontak admin: WA awali 62 tanpa + dan tanpa 0. Telegram tanpa @ */
const ADMIN = { wa: "6288902862338", tg: "Scenangka" };

/* Daftar link Toko Member ada di wb-config.js (TOKO_LINKS). Buka/kunci dilakukan di panel Admin > Pengaturan. */
const LINKS = (window.WB_CONFIG && window.WB_CONFIG.TOKO_LINKS) || [];

const PRODUK = [
  {
    nama: "Wongbagus Prediction",
    desc: "Aplikasi scanner dan rekap angka yang jalan langsung di browser HP, tanpa install.",
    fitur: [
      "Scanner otomatis untuk banyak pasaran",
      "Input rumus manual dan cek trek",
      "Bank rumus untuk menyimpan dan mengelompokkan",
      "Rekap otomatis dan kirim lewat WhatsApp"
    ],
    demo: "./"
  }
];
/* ====== SELESAI ====== */

const WARNA = ["#e5484d","#f2a900","#1fa36b","#2f6bff","#8b5cf6"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

$("brand").textContent = TOKO.nama;
{ const dp = TOKO.deskripsi.split(" · "); $("tag").innerHTML = `<b>${esc(dp[0])}</b>` + (dp[1] ? `<span>${esc(dp[1])}</span>` : ""); }
$("warn").textContent = TOKO.catatan;
$("foot").textContent = TOKO.footer;

const P = PRODUK[0];
$("app").innerHTML = `<section class="produk">
  <h2>${esc(P.nama)}</h2>
  <p class="desc">${esc(P.desc)}</p>
  <ul>${P.fitur.map((f, i) => `<li><span class="dot" style="--c:${WARNA[i % 5]}"></span><span>${esc(f)}</span></li>`).join("")}</ul>
  <div class="aksi">
    <a class="btn pri" id="btnMember" href="#">Scen Member</a>
    <button class="btn ghost" id="btnBadut" type="button">🤡 Salam Hoki</button>
  </div>
  <p id="info"></p>
</section>
<section class="kontak">
  <h3>Sudah daftar? Hubungi admin</h3>
  <p>Setelah selesai daftar di situs member, centang kotak di bawah lalu pilih WhatsApp atau Telegram untuk minta di-ACC.</p>
  <label class="cek"><input type="checkbox" id="sudah"> Saya sudah daftar</label>
  <div class="aksi">
    <a class="btn wa" id="btnWa" href="#" aria-disabled="true">WhatsApp</a>
    <a class="btn tg" id="btnTg" href="#" aria-disabled="true">Telegram</a>
  </div>
</section>`;

/* ---- status link: true/absen = buka, false = terkunci ---- */
let STATUS = {};
const dibuka = () => LINKS.filter(l => STATUS[l.id] !== false);
const simpan = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const baca = k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } };

async function muatStatus() {
  try {
    const c = window.WB_CONFIG || {};
    const acct = c.ACCT || "";
    if (!c.WORKER || !acct) return;
    const base = c.WORKER + "/" + acct;
    const d = await (await fetch(base + "/members", { cache: "no-store" })).json();
    const arr = Array.isArray(d) ? d : ((d && d.data) || []);
    const st = arr.find(m => m.id === "__SETTINGS__");
    if (st && st.tk) STATUS = st.tk;
  } catch (e) { /* gagal baca: semua link dianggap buka */ }
}

function isiKontak() {
  const situs = baca("wb_toko_situs");
  const teks = `Halo admin, saya sudah daftar${situs ? " di situs " + situs : ""}. Mohon di-ACC.`;
  $("btnWa").href = `https://wa.me/${ADMIN.wa}?text=${encodeURIComponent(teks)}`;
  $("btnTg").href = `https://t.me/${ADMIN.tg}?text=${encodeURIComponent(teks)}`;
  for (const id of ["btnWa", "btnTg"]) { $(id).target = "_blank"; $(id).rel = "noopener"; }
}
function setAktif(on) {
  for (const id of ["btnWa", "btnTg"]) $(id).setAttribute("aria-disabled", on ? "false" : "true");
}
$("sudah").checked = baca("wb_toko_sudah") === "1";
setAktif($("sudah").checked);
isiKontak();
$("sudah").addEventListener("change", e => {
  simpan("wb_toko_sudah", e.target.checked ? "1" : "0");
  setAktif(e.target.checked);
});

$("btnMember").addEventListener("click", e => {
  e.preventDefault();
  const buka = dibuka();
  if (!buka.length) {
    $("info").className = "err";
    $("info").textContent = "Pendaftaran sedang penuh. Silakan hubungi admin lewat tombol di bawah.";
    return;
  }
  const pilih = buka[Math.floor(Math.random() * buka.length)];
  simpan("wb_toko_situs", pilih.id);
  isiKontak();
  $("info").className = "";
  $("info").textContent = "Daftar dulu di situs yang terbuka, lalu kembali ke sini dan hubungi admin.";
  window.open(pilih.url, "_blank", "noopener");
});

muatStatus();

/* ---- salam badut ---- */
(function(){
  var box=document.getElementById('badutBox'),btn=document.getElementById('btnBadut');
  if(!box||!btn)return;
  var warna=['#ff5252','#ffd54f','#69f0ae','#40c4ff','#b388ff','#ff80ab'],ikon=['🍀','💰','✨','🪙','🎉'];
  function hujan(){
    box.querySelectorAll('.fx,.up').forEach(function(n){n.remove();});
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    for(var i=0;i<34;i++){var d=document.createElement('i');d.className='fx';
      d.style.cssText='left:'+(Math.random()*100)+'%;width:'+(6+Math.random()*7)+'px;height:'+(10+Math.random()*9)+'px;background:'+warna[i%warna.length]+';animation-duration:'+(2.6+Math.random()*2.6)+'s;animation-delay:'+(Math.random()*1.6)+'s;border-radius:2px';box.appendChild(d);}
    for(var j=0;j<10;j++){var u=document.createElement('span');u.className='up';u.textContent=ikon[j%ikon.length];
      u.style.cssText='left:'+(5+Math.random()*88)+'%;animation-duration:'+(4+Math.random()*3)+'s;animation-delay:'+(Math.random()*2.2)+'s';box.appendChild(u);}
  }
  function buka(){box.classList.add('on');hujan();}
  function tutup(){box.classList.remove('on');box.querySelectorAll('.fx,.up').forEach(function(n){n.remove();});}
  btn.addEventListener('click',buka);
  document.getElementById('badutX').addEventListener('click',tutup);
  box.addEventListener('click',function(e){if(e.target===box)tutup();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')tutup();});
})();

</script>
<!-- ===== MUSIK LATAR (mp3, tanpa iklan) ===== -->
<button id="musBtnM" aria-label="Musik" style="display:none;position:fixed;right:14px;bottom:14px;z-index:99998;width:44px;height:44px;border:0;border-radius:50%;background:#19511e;color:#fff;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.5)">&#128263;</button>
<script>
(function(){
  /* kalau halaman ini dibuka di dalam bingkai halaman utama MASTER, musik sudah diputar di sana: jangan dobel */
  try{ if(window.top!==window.self) return; }catch(e){ return; }
  var SRC='https://angkahoky187-crypto.github.io/MASTER/musik.mp3', KUNCI='wb_musik_mut', mut=false, bunyi=false;
  try{mut=localStorage.getItem(KUNCI)==='1';}catch(e){}
  var au=new Audio(SRC); au.loop=true; au.preload='auto'; au.setAttribute('playsinline','');
  var btn=document.getElementById('musBtnM');
  function ikon(){ btn.innerHTML=(bunyi&&!mut)?'&#128266;':'&#128263;'; }
  function nyalakan(){ try{au.muted=false;au.volume=1;var p=au.play();if(p&&p.catch)p.catch(function(){});}catch(e){} }
  /* jalan dulu tanpa suara, bersuara di ketukan pertama */
  if(!mut){ try{au.muted=true;var p0=au.play();if(p0&&p0.catch)p0.catch(function(){});}catch(e){} }
  /* ketuk/klik apa pun = musik bersuara */
  var EVT=['click','touchend','pointerup','keydown'];
  function picu(e){
    if(mut) return;
    if(e&&e.target===btn) return;
    nyalakan();
    setTimeout(function(){ if(!au.paused&&!au.muted){ bunyi=true; ikon(); EVT.forEach(function(n){document.removeEventListener(n,picu,true);}); } },500);
  }
  EVT.forEach(function(n){document.addEventListener(n,picu,true);});
  btn.addEventListener('click',function(){
    mut=!mut;
    try{localStorage.setItem(KUNCI,mut?'1':'0');}catch(x){}
    if(mut){ try{au.pause();}catch(x){} } else { nyalakan(); }
    bunyi=!mut; ikon();
  });
  /* rahasia admin: ketuk 3x tulisan "Semua bisa jadi master" untuk memunculkan/menyembunyikan tombol mut */
  var tg=document.querySelector('.tag'), t=[];
  if(tg) tg.addEventListener('click',function(){
    var n=Date.now(); t.push(n); t=t.filter(function(x){return n-x<900});
    if(t.length>=3){ t=[]; btn.style.display=(btn.style.display==='none')?'block':'none'; }
  });
  ikon();
})();
</script>

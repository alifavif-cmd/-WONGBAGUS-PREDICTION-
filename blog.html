<script>
(function(){
  var cv=document.getElementById('bgfx');if(!cv||!cv.getContext)return;
  var ctx=cv.getContext('2d'),mq=function(q){return window.matchMedia&&matchMedia(q).matches;};
  var reduce=mq('(prefers-reduced-motion: reduce)'),dark=mq('(prefers-color-scheme: dark)');
  var BALL=[[50,57,214],[168,85,247],[240,160,30],[16,170,125]],BALLD=[[130,138,255],[196,140,255],[255,196,80],[70,215,165]];
  var W=0,H=0,dpr=1,items=[],stars=[],raf=0,last=0,T=0;
  function rnd(a,b){return a+Math.random()*(b-a);}
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function mk(init){
    var ball=Math.random()<0.34;
    return {x:rnd(0,W),y:init?rnd(0,H):H+rnd(40,120),v:rnd(10,30),ph:rnd(0,6.28),sw:rnd(8,22),
      d:Math.floor(rnd(0,10)),ball:ball,r:ball?rnd(15,30):0,s:rnd(16,46),c:Math.floor(rnd(0,4)),a:rnd(0.09,0.2),rot:rnd(-.5,.5)};
  }
  function build(){
    var n=Math.round(Math.max(16,Math.min(34,W/15)));items=[];for(var i=0;i<n;i++)items.push(mk(true));
    stars=[];for(var j=0;j<16;j++)stars.push({x:rnd(0,W),y:rnd(0,H),p:rnd(0,6.28),sp:rnd(.6,1.6),s:rnd(2,4.5)});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    var pal=dark?BALLD:BALL,tx=dark?[190,196,255]:[50,57,214],i,it,x,c,g;
    for(i=0;i<stars.length;i++){
      var st=stars[i],tw=0.5+0.5*Math.sin(T*0.001*st.sp+st.p),al=0.08+0.32*tw;
      ctx.strokeStyle='rgba('+tx[0]+','+tx[1]+','+tx[2]+','+al.toFixed(3)+')';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.moveTo(st.x-st.s,st.y);ctx.lineTo(st.x+st.s,st.y);ctx.moveTo(st.x,st.y-st.s);ctx.lineTo(st.x,st.y+st.s);ctx.stroke();
    }
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(i=0;i<items.length;i++){
      it=items[i];x=it.x+Math.sin(T*0.0006+it.ph)*it.sw;
      if(it.ball){
        c=pal[it.c];
        g=ctx.createRadialGradient(x-it.r*.35,it.y-it.r*.38,it.r*.1,x,it.y,it.r);
        g.addColorStop(0,'rgba(255,255,255,'+(it.a*1.8).toFixed(3)+')');
        g.addColorStop(.35,'rgba('+c[0]+','+c[1]+','+c[2]+','+(it.a*1.6).toFixed(3)+')');
        g.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+','+(it.a*.9).toFixed(3)+')');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,it.y,it.r,0,6.2832);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,'+Math.min(.55,it.a*2.6).toFixed(3)+')';
        ctx.font='800 '+Math.round(it.r*1.05)+'px Georgia,serif';ctx.fillText(it.d,x,it.y+1);
      }else{
        ctx.save();ctx.translate(x,it.y);ctx.rotate(it.rot);
        ctx.fillStyle='rgba('+tx[0]+','+tx[1]+','+tx[2]+','+it.a.toFixed(3)+')';
        ctx.font='700 '+Math.round(it.s)+'px Georgia,serif';ctx.fillText(it.d,0,0);ctx.restore();
      }
    }
  }
  function frame(t){
    var dt=Math.min(0.05,(t-last)/1000||0.016);last=t;T=t;
    for(var i=0;i<items.length;i++){var it=items[i];it.y-=it.v*dt;it.rot+=dt*0.04;if(it.y<-90){items[i]=mk(false);}}
    draw();raf=requestAnimationFrame(frame);
  }
  function start(){if(reduce||raf)return;last=performance.now();raf=requestAnimationFrame(frame);}
  function stop(){if(raf){cancelAnimationFrame(raf);raf=0;}}
  size();build();draw();start();
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  var rt=0;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){size();build();draw();},180);});
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(e){dark=e.matches;draw();});}catch(e){}
})();
</script>

const MODES = [
  ["BBFS 4D", ["bbfs 4d"]], ["BBFS AC", ["bbfs ac"]], ["BBFS CK", ["bbfs ck"]], ["BBFS KE", ["bbfs ke"]],
  ["Pos AS", ["pos a", "pos as"]], ["Pos CP", ["pos c", "pos cp"]], ["Pos KP", ["pos k", "pos kp"]], ["Pos EK", ["pos e", "pos ek"]],
  ["AI Depan", ["ai dpn", "ai dep", "ai depan"]], ["AI Tengah", ["ai tgh", "ai teng", "ai tengah"]], ["AI Belakang", ["ai ke", "ai", "ai belakang", "ai blk"]],
  ["Off AC", ["off ac"]], ["Off CK", ["off ck"]], ["Off KE", ["off ke"]], ["Off 4D", ["off 4d"]]
];
const LAIN = MODES.length;
const modeIdx = label => {
  let t = String(label || "").toLowerCase().replace(/\s+/g, " ").trim().replace(/^(off )+/, "off ");
  for (let i = 0; i < MODES.length; i++) if (MODES[i][1].includes(t)) return i;

};
const linkOnly = l => /https?:\/\//i.test(l) && !l.replace(/https?:\/\/\S+/gi, "").replace(/[\s🔗👉➡️▶️:：\-–—•·]/gu, "");
const junk = l => !l.trim() || /^(💫\s*WB\.PREDICTION\s*💫|UPS\s*🙏|\(lanjutan trek\).*|━+.*━+)$/i.test(l.trim());
function parsePost(p){
  const lines = norm(p.isi || "").replace(/\r/g, "").split("\n");
  const raw = [], extras = []; let cur = null;
  const flush = () => { if (cur) { while (cur.l.length && !cur.l[cur.l.length - 1].trim()) cur.l.pop(); raw.push(cur); } cur = null; };
  for (const l0 of lines) {
    const l = l0.replace(/\s+$/, "");
    if (/WONGBAGUS PREDICTION/i.test(l)) { flush(); cur = { l: [l], done: false }; continue; }
    if (cur && !cur.done) {
      if (linkOnly(l) || /^(UPS\s*🙏|💫\s*WB\.PREDICTION\s*💫)$/i.test(l.trim())) continue;
      cur.l.push(l);
      if (/\d+\s*putaran/i.test(l)) cur.done = true;
    } else if (!junk(l) && !linkOnly(l)) extras.push(l);
  }
  flush();
  const blocks = raw.map(b => {
    const text = b.l.join("\n"), code = (text.match(/Code\s*[:：]\s*(\S+)/i) || [])[1] || "";
    let idx = -1, nd = 0;
    const m = text.match(/Rumus\s*[:：]\s*(.+?)\s+(\d)\s*Digit/i) || text.match(/Rumus\s*[:：]\s*(.+)$/im);
    if (m) { idx = modeIdx(m[1]); if (m[2]) nd = +m[2]; }
    const st = +((text.match(/(\d+)\s*putaran/i) || [])[1] || 0);
    return { type: "trek", text, idx, nd, st, code, dk: (idx >= 0 && code) ? idx + "|" + code + "|" + nd : "t|" + text };
  });
  return { blocks, note: extras.join("\n").trim() };
}
/* semua postingan satu hari -> { pasaran: { posts, groups:{idx:[item]}, ntrek } } tanpa dobel */
function buildMarkets(list){
  const M = {};
  list.forEach(p => {
    const k = pasaranKey(p.judul);
    const m = M[k] || (M[k] = { posts: [], seen: {}, groups: {} });
    m.posts.push(p);
    const add = (idx, item, dk) => {
      const g = m.groups[idx] || (m.groups[idx] = []);
      const old = g.find(x => x.dk === dk);
      if (!old) { item.dk = dk; g.push(item); }
      else if (item.type === "trek" && item.st > old.st) { Object.assign(old, item, { dk }); }
    };
    const pr = parsePost(p);
    pr.blocks.forEach(b => add(b.idx >= 0 ? b.idx : LAIN, b, b.dk));
    if (pr.blocks.length) { if (pr.note) add(LAIN, { type: "note", text: pr.note }, "n|" + pr.note); }
    else add(LAIN, { type: "post", p, text: norm(p.isi || "").split("\n").filter(l => !linkOnly(l)).join("\n").trim() }, "p|" + norm(p.isi || "").trim() + "|" + (p.gambar ? String(p.gambar).length : 0));
  });
  Object.values(M).forEach(m => {
    Object.keys(m.groups).forEach(i => { if (+i < LAIN) m.groups[i].sort((a, b) => b.nd - a.nd || b.st - a.st || (a.code < b.code ? -1 : 1)); });
    m.ntrek = Object.values(m.groups).reduce((n, g) => n + g.filter(x => x.type === "trek").length, 0);
  });
  return M;
}

/* gabung semua trek satu kelompok jadi satu teks: header sekali, tiap trek mulai dari "🔑 Code", tanpa baris Rumus/Otomatis/putaran */
function mergeTreks(trs){
  const SEP = /^[─━\-–—=_]{5,}\s*$/;
  const rumusOf = t => (t.text.split("\n").find(l => /Rumus\s*[:：]/i.test(l)) || "").trim();
  const mixed = new Set(trs.map(rumusOf)).size > 1;
  const out = []; let prev = null;
  trs.forEach((t, n) => {
    const lines = t.text.split("\n").map(l => l.replace(/\s+$/, ""));
    const ci = lines.findIndex(l => /Code\s*[:：]/i.test(l));
    const head = ci > 0 ? lines.slice(0, ci).filter(l => l.trim()) : [];
    let rest = (ci >= 0 ? lines.slice(ci) : lines).filter(l => !/Rumus\s*[:：]/i.test(l) && !/(Otomatis|Prediksi)\s*[·•]/i.test(l) && !/Otomatis/i.test(l) && !/\d+\s*putaran/i.test(l));
    if (ci < 0 && n > 0) rest = rest.filter(l => !/WONGBAGUS PREDICTION/i.test(l));
    while (rest.length > 1 && !rest[1].trim()) rest.splice(1, 1);   // tidak ada baris kosong setelah Code
    while (rest.length && !rest[rest.length - 1].trim()) rest.pop();
    const r = rumusOf(t);
    if (n === 0) out.push(...head); else out.push("");
    if (mixed && r && r !== prev) out.push(r);
    prev = r;
    out.push(...rest);
  });
  return out.join("\n");
}

/* video dari galeri: diperkecil di HP (maks 30 dtk, 480px, tanpa suara) lalu disimpan per potongan di Firestore */
const kompresVideo = (file, info) => new Promise(async (ok, no) => {
  let u = "";
  try {
    if (!window.MediaRecorder) throw new Error("Browser ini belum bisa memperkecil video. Pakai Chrome terbaru, atau pakai link YouTube.");
    u = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = u;
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("Video tidak bisa dibaca.")); });
    if (!(v.duration > 0) || v.duration > 31) throw new Error("Video maksimal 30 detik (video ini sekitar " + Math.round(v.duration) + " detik). Potong dulu di galeri.");
    const W = Math.min(480, v.videoWidth || 480), H = Math.max(2, Math.round((v.videoHeight || 270) * W / (v.videoWidth || 480) / 2) * 2);
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    const mime = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find(t => MediaRecorder.isTypeSupported(t));
    if (!mime) throw new Error("Browser ini belum bisa memperkecil video. Pakai Chrome terbaru, atau pakai link YouTube.");
    const rec = new MediaRecorder(c.captureStream(24), { mimeType: mime, videoBitsPerSecond: 450000 });
    const parts = []; rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
    const done = new Promise(r => { rec.onstop = r; });
    rec.start(500);
    let stop = false;
    const tick = () => { if (stop) return; g.drawImage(v, 0, 0, W, H); if (info) info(Math.min(99, Math.round(v.currentTime / v.duration * 100))); requestAnimationFrame(tick); };
    v.onended = () => { stop = true; setTimeout(() => { try { rec.stop(); } catch (e) {} }, 300); };
    await v.play(); tick();
    await done;
    const blob = new Blob(parts, { type: mime.split(";")[0] });
    if (blob.size > 3000000) throw new Error("Hasil video masih terlalu besar (" + (blob.size / 1e6).toFixed(1) + " MB). Pakai video yang lebih pendek.");
    ok(blob);
  } catch (e) { no(e); }
  finally { if (u) URL.revokeObjectURL(u); }
});

      } catch (e) { alert("Gagal kirim komentar: " + (e.code || e.message)); }
      ck.disabled = false;
    };
    $("cml").onclick = async e => {
      const b = e.target.closest("button[data-c]"); if (!b || !confirm("Hapus komentar ini?")) return;
      b.disabled = true;
      try {
        await deleteDoc(doc(db, "posts", p.id, "comments", b.dataset.c));
        try { await deleteDoc(doc(db, "commentPrivate", b.dataset.c)); } catch (x) {}
      } catch (err) { alert("Gagal hapus: " + err.code); b.disabled = false; }
    };
    startCm(p.id);
    window.scrollTo(0, 0);
    return;
  }

  stopCm();
  document.title = "💫WB.PREDICTION💫";
  const composer = isAdmin()
    ? `<details class="compose" id="cmp"><summary>Tulis postingan</summary><form id="f"><label for="j">Judul</label><input id="j" maxlength="120" required><label for="i">Isi</label><textarea id="i" maxlength="5000" required></textarea><button class="btn" id="kirim">Kirim</button></form></details>`
    : "";
  const chip = (v, t) => `<button class="chip${String(fDay) === String(v) ? " on" : ""}" data-d="${v}">${t}</button>`;
  const bar = `<div class="bar"><input type="search" id="cari" placeholder="Cari pasaran…" value="${esc(fQ)}"><div class="chips">${[0,1,2,3,4,5,6].map(o => { const d = new Date(); d.setDate(d.getDate() - o); return chip(o, o === 0 ? "Hari ini" : o === 1 ? "Kemarin" : HARI[d.getDay()] + " " + d.getDate()); }).join("")}</div>${isAdmin() ? `<div class="adm"><button class="btn del" id="hps">Hapus yang tampil</button><button class="btn del" id="hpa">Hapus semua</button></div>` : ""}</div>`;
  main.innerHTML = composer + bar + `<div id="ads"></div><div id="plist"></div>`;
  drawAds();
  $("cari").oninput = e => { fQ = e.target.value.trim().toLowerCase(); renderList(); };
  main.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    fDay = Number(c.dataset.d);
    main.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); watchDay(fDay);
  });
  const hs = $("hps"), ha = $("hpa");
  if (hs) hs.onclick = () => hapusMassal(hs._ids || [], "Hapus yang tampil");
  if (ha) ha.onclick = () => hapusSemuaHari(ha);
  renderList();

  const f = $("f");
  if (f) f.onsubmit = async e => {
    e.preventDefault();
    const b = $("kirim"); b.disabled = true;
    try {
      await addDoc(collection(db, "posts"), { judul: $("j").value.trim(), isi: $("i").value.trim(), uid: user.uid, nama: user.displayName || "Anonim", createdAt: serverTimestamp() });
      f.reset(); $("cmp").open = false;
    } catch (err) { alert("Gagal kirim: " + err.code); }
    b.disabled = false;
  };
  const i2 = $("in2"); if (i2) i2.onclick = login;
}

(function(){
  const a = document.querySelector("a.home"), w = $("who"); if (!a || !w) return;
  let t = 0, fired = false;
  const start = () => { fired = false; clearTimeout(t); t = setTimeout(() => { fired = true; w.classList.toggle("show"); try { navigator.vibrate && navigator.vibrate(60); } catch (e) {} }, 3000); };
  const end = () => clearTimeout(t);
  a.addEventListener("pointerdown", start);
  ["pointerup", "pointerleave", "pointercancel"].forEach(n => a.addEventListener(n, end));
  a.addEventListener("click", e => { if (fired) { e.preventDefault(); fired = false; } });
  a.addEventListener("contextmenu", e => e.preventDefault());
})();

<script>
/* tombol Mode Web / Mode HP: di HP, halaman dibuka selebar 1100px (tampilan desktop dua kolom), bisa dicubit untuk zoom */
(function(){
  var b=document.getElementById('wmode'); if(!b) return;
  if(Math.min(screen.width,screen.height)>=900){ b.parentNode.style.display='none'; return; }
  var framed=false; try{ framed=window.top!==window.self; }catch(e){ framed=true; }
  function on(){ try{ return localStorage.getItem('wb_web')!=='0'; }catch(e){ return true; } }
  function label(){ b.textContent=on()?'📱 Mode HP':'🖥️ Mode Web'; }
  b.addEventListener('click',function(){
    var v=!on();
    try{ localStorage.setItem('wb_web',v?'1':'0'); }catch(e){}
    if(framed){ try{ parent.postMessage({wb:'mode',web:v},'*'); }catch(e){} }
    else{ document.querySelector('meta[name=viewport]').setAttribute('content',v?'width=1100':'width=device-width, initial-scale=1'); }
    label();
  });
  label();
})();
</script>
<!-- ===== MUSIK LATAR (mp3, tanpa iklan) ===== -->
<button id="musBtnM" aria-label="Musik" style="display:none;position:fixed;right:14px;bottom:14px;z-index:99998;width:44px;height:44px;border:0;border-radius:50%;background:#19511e;color:#fff;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.5)">&#128263;</button>
<script>
(function(){
  /* kalau halaman ini dibuka di dalam bingkai halaman utama MASTER, musik sudah diputar di sana: jangan dobel */
  var diBingkai=false; try{ diBingkai=window.top!==window.self; }catch(e){ diBingkai=true; }
  if(diBingkai){
    /* di dalam bingkai halaman utama: teruskan ketukan (agar musik bersuara) dan rahasia admin (ketuk 3x tulisan "Semua bisa jadi master") ke halaman utama */
    var kirim=function(m){ try{ parent.postMessage(m,'*'); }catch(e){} };
    var lastTap=0;
    ['click','touchend','pointerup','keydown'].forEach(function(n){ document.addEventListener(n,function(){ var x=Date.now(); if(x-lastTap<400) return; lastTap=x; kirim({wb:'tap'}); },true); });
    var tg0=document.querySelector('.tag'), t0=[];
    if(tg0) tg0.addEventListener('click',function(){ var n=Date.now(); t0.push(n); t0=t0.filter(function(x){return n-x<900}); if(t0.length>=3){ t0=[]; kirim({wb:'musik-toggle'}); } });
    return;
  }
  var SRC='https://angkahoky187-crypto.github.io/MASTER/musik.mp3', KUNCI='wb_musik_mut', mut=false, bunyi=false;
  try{mut=localStorage.getItem(KUNCI)==='1';}catch(e){}
  var au=new Audio(SRC); au.loop=true; au.preload='auto'; au.setAttribute('playsinline','');
  var btn=document.getElementById('musBtnM');
  function ikon(){ btn.innerHTML=(bunyi&&!mut)?'&#128266;':'&#128263;'; }
  function nyalakan(){ try{au.muted=false;au.volume=1;var p=au.play();if(p&&p.catch)p.catch(function(){});}catch(e){} }
  /* jalan dulu tanpa suara, bersuara di ketukan pertama */
  if(!mut){ try{au.muted=true;var p0=au.play();if(p0&&p0.catch)p0.catch(function(){});}catch(e){} }
  /* ketuk/klik apa pun = musik bersuara */
  var EVT=['click','touchend','pointerup','keydown'];
  function picu(e){
    if(mut) return;
    if(e&&e.target===btn) return;
    nyalakan();
    setTimeout(function(){ if(!au.paused&&!au.muted){ bunyi=true; ikon(); EVT.forEach(function(n){document.removeEventListener(n,picu,true);}); } },500);
  }
  EVT.forEach(function(n){document.addEventListener(n,picu,true);});
  btn.addEventListener('click',function(){
    mut=!mut;
    try{localStorage.setItem(KUNCI,mut?'1':'0');}catch(x){}
    if(mut){ try{au.pause();}catch(x){} } else { nyalakan(); }
    bunyi=!mut; ikon();
  });
  /* rahasia admin: ketuk 3x tulisan "Semua bisa jadi master" untuk memunculkan/menyembunyikan tombol mut */
  var tg=document.querySelector('.tag'), t=[];
  if(tg) tg.addEventListener('click',function(){
    var n=Date.now(); t.push(n); t=t.filter(function(x){return n-x<900});
    if(t.length>=3){ t=[]; btn.style.display=(btn.style.display==='none')?'block':'none'; }
  });
  /* musik berhenti sendiri saat halaman tidak terlihat (pindah aplikasi/tab, layar mati), lanjut lagi saat dibuka kembali */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){ try{au.pause();}catch(e){} return; }
    if(mut) return;
    if(bunyi){ nyalakan(); }
    else{ try{au.muted=true;var pv=au.play();if(pv&&pv.catch)pv.catch(function(){});}catch(e){} }
  });
  window.addEventListener('pagehide',function(){ try{au.pause();}catch(e){} });
  ikon();
})();
</script>
